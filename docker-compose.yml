services:

  aidaan:
    build: .
    container_name: aidaan_backend
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      redis:
        condition: service_healthy
      cloud-sql-proxy:
        condition: service_started
    volumes:
      - .:/app
    command: uvicorn app.api.server:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --reload-exclude .venv --reload-exclude .git --reload-exclude __pycache__ --reload-exclude *.pyc --reload-exclude locustfile_ws_aidaan.py
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    runtime: nvidia
    shm_size: '2gb'
    deploy:
      resources:
        limits:
          cpus: '7.5'
          memory: 28G
        reservations:
          cpus: '4.0'
          memory: 16G
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu, compute, utility]

  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
    container_name: aidaan_cloud_sql_proxy
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "idbx-backend-dev:us-central1:idbx-development"
      - "--credentials-file=/config/cloud-sql-service-account.json"
    volumes:
      - ./gen-lang-client-0710731093-26add4ee7529.json:/config/cloud-sql-service-account.json:ro
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: aidaan_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: aidaan_postgres
    profiles:
      - local-db
    environment:
      - POSTGRES_DB=aidann
      - POSTGRES_USER=aidann_app
      - POSTGRES_PASSWORD=aidann_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidann_app -d aidann"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  postgres_data:
