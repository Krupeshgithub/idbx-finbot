services:

  aidaan:
    build: .
    container_name: aidaan_backend
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.api.server:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --reload-exclude .venv --reload-exclude .git --reload-exclude __pycache__ --reload-exclude *.pyc --reload-exclude locustfile_ws_aidaan.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: aidaan_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: aidaan_postgres
    environment:
      - POSTGRES_DB=aidann
      - POSTGRES_USER=aidann_app
      - POSTGRES_PASSWORD=aidann_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidann_app -d aidann"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  postgres_data:
