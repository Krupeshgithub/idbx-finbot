version: '3.8'

services:

  aidaan:
    build: .
    container_name: aidaan_backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PROJECT_NAME=AIDAAN-Institutional
      - GOOGLE_GENAI_USE_VERTEXAI=true
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-global}
      - VERTEX_AI_MODEL_NAME=${VERTEX_AI_MODEL_NAME:-gemini-2.5-flash}
      - VERTEX_AI_REASONING_MODEL_NAME=${VERTEX_AI_REASONING_MODEL_NAME:-gemini-2.5-pro}
      - VERTEX_AI_API_VERSION=${VERTEX_AI_API_VERSION:-v1}
      - VERTEX_AI_USE_EXPRESS_MODE=${VERTEX_AI_USE_EXPRESS_MODE:-true}
      - VERTEX_AI_SERVICE_ACCOUNT_FILE=${VERTEX_AI_SERVICE_ACCOUNT_FILE:-}
      - VERTEX_AI_SERVICE_ACCOUNT_JSON=${VERTEX_AI_SERVICE_ACCOUNT_JSON:-}
      - VERTEX_AI_ENABLE_GOOGLE_SEARCH=${VERTEX_AI_ENABLE_GOOGLE_SEARCH:-false}
      - VERTEX_AI_ENABLE_URL_CONTEXT=${VERTEX_AI_ENABLE_URL_CONTEXT:-false}
      - VERTEX_AI_ENABLE_CODE_EXECUTION=${VERTEX_AI_ENABLE_CODE_EXECUTION:-false}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.api.server:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:

    image: redis:7.2-alpine
    container_name: aidaan_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
