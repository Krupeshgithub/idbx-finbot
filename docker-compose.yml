version: '3.8'

services:
  aidaan:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PROJECT_NAME=AIDAAN-Institutional
    depends_on:
      - redis
    volumes:
      - .:/app
    command: uvicorn app.api.server:app --host 0.0.0.0 --port 8000 --reload

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
